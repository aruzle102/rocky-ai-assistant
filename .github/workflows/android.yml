name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners already ship the Android SDK at $ANDROID_HOME.
      # android-actions/setup-android@v3 is NOT used: it fails on current
      # runners because it tries to install the obsolete 'tools' package
      # ("Warning: Failed to find package 'tools'", sdkmanager exit 1).
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/platforms" || true

      - name: Unit tests (JUnit, pure Kotlin)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit-test reports (diagnosis, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROCKY_AI-test-reports
          path: |
            android/app/build/test-results/testDebugUnitTest
            android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 30

      - name: Build debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists and is non-empty
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || (echo "APK missing or empty: $APK" && exit 1)
          ls -lh "$APK"
          unzip -l "$APK" | head -60

      - name: Inspect APK package identity (aapt)
        run: |
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          if [ ! -x "$AAPT" ]; then AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | head -1); fi
          echo "Using aapt: $AAPT"
          "$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -20
          "$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -E "package:|application-label" || true

      - name: Check native classes, no Capacitor web bundle as the app
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          echo "Checking for native Kotlin classes (dex)..."
          unzip -l "$APK" | grep -E "classes.*\.dex" || (echo "No dex found" && exit 1)
          if unzip -l "$APK" | grep -q "assets/public/index.html"; then
            echo "::error::Capacitor web bundle still present in APK"
            exit 1
          fi
          echo "Native check passed: dex present, no Capacitor web bundle."

      - name: Secret scan of sources (fail on obvious key patterns)
        run: |
          echo "Scanning Kotlin sources for committed secrets (patterns only, no values printed)..."
          if grep -RInE "sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}" android/app/src/main/ 2>/dev/null; then
            echo "::error::Possible secret pattern found in sources"
            exit 1
          fi
          echo "Secret scan clean."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROCKY_AI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          {
            echo "## ROCKY AI v4 (native Kotlin) build"
            echo ""
            echo "- Commit: ${{ github.sha }}"
            echo "- Ref: ${{ github.ref }}"
            echo "- Artifact: ROCKY_AI-debug-apk (app-debug.apk)"
            echo "- Package: com.modaliadz.rocky"
            echo "- App name: ROCKY AI"
            echo "- Status: build completed (this summary is written only if all prior steps passed)"
            echo "- Tests: JUnit unit tests (providers/failover, tasks, agent loop, jaw timing, back navigation)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Emulator screenshot: best-effort only. It must NOT block the APK job.
  screenshot:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ROCKY_AI-debug-apk
          path: apk

      - name: Run on emulator and capture a screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r apk/app-debug.apk
            adb shell am start -n com.modaliadz.rocky/.MainActivity
            sleep 15
            adb exec-out screencap -p > screenshot.png
            ls -lh screenshot.png
            # App-info view shows the launcher icon as the system renders it
            # (best available launcher-adjacent view in an emulator; the
            # launcher grid itself is not captured here).
            adb shell am start -a android.settings.APPLICATION_DETAILS_SETTINGS -d package:com.modaliadz.rocky
            sleep 4
            adb exec-out screencap -p > screenshot-appinfo.png
            ls -lh screenshot-appinfo.png || true

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROCKY_AI-screenshot
          path: screenshot.png
          if-no-files-found: warn
          retention-days: 30

      - name: Upload app-info screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROCKY_AI-screenshot-appinfo
          path: screenshot-appinfo.png
          if-no-files-found: warn
          retention-days: 30

  # Continuous demo recording: silent emulator video ONLY (adb
  # screenrecord records NO audio, and an emulator has no real mic, so
  # this can never prove a spoken question or an audible answer — it
  # shows launch, intro, face, a TYPED agent request, and the project
  # preview. Best-effort, must NOT block the APK job. No audio is ever
  # dubbed onto it; the voice loop stays code + unit-test + provider
  # evidence, with phone testing still required for audible speech.
  demo:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ROCKY_AI-debug-apk
          path: apk

      - name: Record silent emulator demo (launch, agent request, preview)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r apk/app-debug.apk
            adb shell screenrecord --time-limit 75 /sdcard/rocky-demo.mp4 &
            sleep 2
            adb shell am start -n com.modaliadz.rocky/.MainActivity --es demo_question "Build a professional restaurant website with a menu, gallery, responsive design, and reservation form"
            sleep 40
            adb shell am start -n com.modaliadz.rocky/.PreviewActivity --es slug restaurant
            sleep 35
            adb pull /sdcard/rocky-demo.mp4 ./rocky-demo.mp4 || echo "demo video pull failed"
            ls -lh rocky-demo.mp4 || true

      - name: Upload demo video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROCKY_AI-demo-video
          path: rocky-demo.mp4
          if-no-files-found: warn
          retention-days: 30
